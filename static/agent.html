<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 工作台 — AI 工作流引擎</title>
<style>
/* ══════════════════════════════════════════════════════════
   CSS 变量 & 暗色主题（复用项目一配色）
   ══════════════════════════════════════════════════════════ */
:root {
  --bg: #1a1a2e;
  --card: #161b22;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --text: #eee;
  --text-dim: #8b949e;
  --user-bubble: #1f2937;
  --ai-bubble: #0d1117;
  --input-bg: #161b22;
  --border: #30363d;
  --success: #3fb950;
  --warn: #d2991d;
  --hover: #1c2128;
  --tool-bg: #0d1520;
  --radius: 10px;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: var(--bg);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 860px;
  margin: 0 auto;
  overflow: hidden;
}

/* ── 顶部导航 ───────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header h1 { font-size: 1.15rem; font-weight: 600; }
.header .badge {
  font-size: 0.75rem;
  background: var(--accent);
  color: #fff;
  padding: 3px 10px;
  border-radius: 12px;
}

/* ── 消息区域 ───────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
/* 滚动条 */
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── 用户消息气泡 ───────────────────────────────────────── */
.msg-user {
  align-self: flex-end;
  max-width: 75%;
  background: var(--user-bubble);
  border-radius: var(--radius);
  border-bottom-right-radius: 4px;
  padding: 10px 14px;
  animation: fadeIn 0.25s ease;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ── Agent 消息容器 ─────────────────────────────────────── */
.agent-block {
  align-self: flex-start;
  width: 100%;
  animation: fadeIn 0.3s ease;
}

/* ── Round 卡片（每轮思考） ─────────────────────────────── */
.round-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
}
.round-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  font-size: 0.85rem;
  color: var(--text-dim);
  transition: background 0.15s;
}
.round-header:hover { background: var(--hover); }
.round-header .arrow {
  font-size: 0.65rem;
  transition: transform 0.2s;
  color: var(--text-dim);
}
.round-card.collapsed .arrow { transform: rotate(-90deg); }
.round-card.collapsed .round-body { display: none; }
.round-header .label { font-weight: 600; color: var(--text); }
.round-header .tool-list { margin-left: auto; font-size: 0.78rem; }

.round-body { padding: 4px 14px 10px; }

/* ── 工具调用行 ─────────────────────────────────────────── */
.tool-line {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 4px 0;
  font-size: 0.83rem;
  line-height: 1.5;
}
.tool-line .icon { flex-shrink: 0; width: 18px; text-align: center; }
.tool-line .icon.call { color: var(--warn); }
.tool-line .icon.ok { color: var(--success); }
.tool-line .icon.fail { color: var(--accent); }
.tool-line code {
  background: var(--tool-bg);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #79c0ff;
  word-break: break-all;
}
.tool-line .result-text {
  color: var(--text-dim);
  font-size: 0.8rem;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── 最终回答 ───────────────────────────────────────────── */
.final-answer {
  background: var(--ai-bubble);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  padding: 10px 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 0.9rem;
}

/* ── 输入区 ─────────────────────────────────────────────── */
.input-area {
  display: flex;
  gap: 10px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.input-area textarea {
  flex: 1;
  resize: none;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 10px 14px;
  font-size: 0.9rem;
  font-family: inherit;
  line-height: 1.5;
  min-height: 44px;
  max-height: 120px;
  transition: border-color 0.2s;
}
.input-area textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.input-area button {
  flex-shrink: 0;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 0 20px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.input-area button:hover { opacity: 0.9; }
.input-area button:active { transform: scale(0.96); }
.input-area button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ── 加载动画 ───────────────────────────────────────────── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── 欢迎提示 ───────────────────────────────────────────── */
.welcome {
  text-align: center;
  color: var(--text-dim);
  padding: 40px 20px;
  font-size: 0.9rem;
  line-height: 1.8;
}
.welcome b { color: var(--accent); }

/* ── 错误提示 ───────────────────────────────────────────── */
.error-card {
  background: #2d1520;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 10px 14px;
  color: var(--accent);
  font-size: 0.85rem;
}
</style>
</head>
<body>

<!-- ═══════════════════ 顶部 ═══════════════════ -->
<div class="header">
  <h1>🤖 Agent 工作台</h1>
  <span class="badge">7 Tools · SSE 流式</span>
</div>

<!-- ═══════════════════ 消息区 ═══════════════════ -->
<div class="messages" id="messages">
  <div class="welcome">
    👋 试试这些任务：<br><br>
    <b>「现在几点了？保存到 time.txt」</b><br>
    <b>「搜索 Python asyncio，总结保存到文件」</b><br>
    <b>「北京今天天气怎么样？」</b><br>
    <b>「知识库里有哪些内容？」</b>
  </div>
</div>

<!-- ═══════════════════ 输入区 ═══════════════════ -->
<div class="input-area">
  <textarea id="input" rows="1"
    placeholder="输入任务，Enter 发送，Shift+Enter 换行"
    onkeydown="handleKey(event)"></textarea>
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   SSE 消费 + UI 渲染
   ═══════════════════════════════════════════════════════════ */

const messagesEl = document.getElementById('messages');
const inputEl   = document.getElementById('input');
const sendBtn   = document.getElementById('sendBtn');

let isStreaming = false;
let currentAgentBlock = null;   // 当前 agent-block DOM
let currentRound     = null;   // 当前 round-card DOM
let currentRoundBody = null;   // 当前 round-card 的 body DOM

// ── 工具函数 ──────────────────────────────────────────────
function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function clearWelcome() {
  const w = messagesEl.querySelector('.welcome');
  if (w) w.remove();
}

// ── 键盘处理 ──────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

// ── 发送消息 ──────────────────────────────────────────────
async function send() {
  const msg = inputEl.value.trim();
  if (!msg || isStreaming) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isStreaming = true;
  sendBtn.disabled = true;
  clearWelcome();

  // 1. 渲染用户消息气泡
  const userDiv = document.createElement('div');
  userDiv.className = 'msg-user';
  userDiv.textContent = msg;
  messagesEl.appendChild(userDiv);
  scrollBottom();

  // 2. 创建 Agent 消息块
  currentAgentBlock = document.createElement('div');
  currentAgentBlock.className = 'agent-block';
  messagesEl.appendChild(currentAgentBlock);

  // 3. 显示加载指示器
  const loading = document.createElement('div');
  loading.className = 'round-card';
  loading.innerHTML = `<div class="round-header"><span class="spinner"></span> Agent 思考中...</div>`;
  currentAgentBlock.appendChild(loading);
  scrollBottom();

  try {
    const resp = await fetch('/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      // 移除加载指示器
      loading.remove();
      showError('服务器错误: ' + escHtml(errText));
      return;
    }

    // 移除加载指示器
    loading.remove();

    // 4. SSE 流解析（同项目一：fetch + reader）
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // SSE 事件以 \n\n 分隔
      const parts = buffer.split('\n\n');
      buffer = parts.pop();  // 最后一段可能不完整，留着下次拼接

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;

        const payload = line.slice(6);  // 去掉 "data: " 前缀
        if (payload === '[DONE]') continue;

        try {
          const event = JSON.parse(payload);
          handleEvent(event);
        } catch (_) {
          // 非 JSON 内容忽略
        }
      }
    }

    // 处理 buffer 中残留的最后一条
    if (buffer.trim().startsWith('data: ')) {
      const payload = buffer.trim().slice(6);
      if (payload && payload !== '[DONE]') {
        try { handleEvent(JSON.parse(payload)); } catch (_) {}
      }
    }

  } catch (err) {
    // 网络异常
    showError('网络错误: ' + escHtml(err.message));
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
    currentAgentBlock = null;
    currentRound = null;
    currentRoundBody = null;
  }
}

// ── 事件处理器 ────────────────────────────────────────────
function handleEvent(event) {
  switch (event.type) {

    // ═══ thinking: 新 Round 开始 ═══
    case 'thinking': {
      currentRound = document.createElement('div');
      currentRound.className = 'round-card';

      const toolsStr = (event.tools && event.tools.length)
        ? event.tools.join(', ')
        : '';

      currentRound.innerHTML =
        `<div class="round-header" onclick="this.parentElement.classList.toggle('collapsed')">` +
        `<span class="arrow">&#9660;</span>` +
        `<span class="label">Round ${event.step}/${event.max_steps}</span>` +
        (toolsStr ? `<span class="tool-list">可用: ${escHtml(toolsStr)}</span>` : '') +
        `</div>` +
        `<div class="round-body"></div>`;

      currentRoundBody = currentRound.querySelector('.round-body');
      currentAgentBlock.appendChild(currentRound);
      scrollBottom();
      break;
    }

    // ═══ tool_call: 工具调用 ═══
    case 'tool_call': {
      if (!currentRoundBody) break;
      const argsStr = JSON.stringify(event.args);
      const line = document.createElement('div');
      line.className = 'tool-line';
      line.innerHTML =
        `<span class="icon call">&#9654;</span>` +
        `<span><b>${escHtml(event.tool)}</b>` +
        `<code>${escHtml(argsStr.length > 80 ? argsStr.slice(0,80) + '...' : argsStr)}</code></span>`;
      currentRoundBody.appendChild(line);
      scrollBottom();
      break;
    }

    // ═══ tool_result: 工具结果 ═══
    case 'tool_result': {
      if (!currentRoundBody) break;
      const ok = event.success;
      const preview = (event.output || '').slice(0, 120);
      const line = document.createElement('div');
      line.className = 'tool-line';
      line.innerHTML =
        `<span class="icon ${ok ? 'ok' : 'fail'}">${ok ? '&#10004;' : '&#10008;'}</span>` +
        `<span class="result-text" title="${escHtml(event.output || '')}">${escHtml(preview)}</span>`;
      currentRoundBody.appendChild(line);
      scrollBottom();
      break;
    }

    // ═══ text: 最终回答 ═══
    case 'text': {
      const answerDiv = document.createElement('div');
      answerDiv.className = 'final-answer';
      answerDiv.textContent = event.content;
      currentAgentBlock.appendChild(answerDiv);
      scrollBottom();
      break;
    }

    // ═══ done: 完成 ═══
    case 'done':
      // 流正常结束，无需额外操作
      break;

    // ═══ error: 出错 ═══
    case 'error': {
      showError(event.message);
      break;
    }
  }
}

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-card';
  div.textContent = 'Error: ' + msg;
  messagesEl.appendChild(div);
  scrollBottom();
}
</script>
</body>
</html>
